name: Publish candidate

# Started automatically by the source repo's release workflow (or by hand):
#   1. download the candidate assets from the source repo (GitHub App, read-only)
#   2. check the tarball is byte-for-byte the candidate (sha256 input)
#   3. sign the manifest (ssh-keygen -Y sign, namespace harmony-release)
#   4. publish it as a PRE-RELEASE: staging servers install it, hotels do not
# After testing on staging, "Promote release" turns exactly these files into the
# release hotels see. Nothing is rebuilt or re-signed.
#
# Runs only in the protected "production" environment (main branch only), the
# only place that holds SIGNING_KEY. Releases are never replaced or downgraded.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (X.Y.Z)"
        required: true
      sha256:
        description: "sha256 of harmony-X.Y.Z.tar.gz (from the candidate page)"
        required: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ github.repository_owner }}/${{ vars.SOURCE_REPO_NAME || 'harmony-v2-dev' }}
  VERSION: ${{ inputs.version }}
  EXPECTED_SHA256: ${{ inputs.sha256 }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check inputs and version order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version"; exit 1; }
          echo "$EXPECTED_SHA256" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::bad sha256"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already published (releases are never replaced)"; exit 1
          fi
          latest="$(gh release list --exclude-pre-releases --exclude-drafts --limit 100 \
            --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' \
            | sort -V | tail -1)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is older than the latest published $latest"; exit 1
          fi

      # Short-lived (1 h) token of the release GitHub App: Contents read-only, only
      # on the source repo. Owned by the account/org, not by a person; nothing expires.
      - name: Token for the source repo
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.SOURCE_REPO_NAME || 'harmony-v2-dev' }}
          permission-contents: read

      - name: Download candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir dist
          gh release download "v$VERSION" --repo "$SOURCE_REPO" --dir dist \
            --pattern "harmony-$VERSION.tar.gz" --pattern "harmony-$VERSION.manifest.json"
          gh release view "v$VERSION" --repo "$SOURCE_REPO" --json body --jq .body \
            | sed '/^\*\*\(Release candidate\|Candidate\)/,/^- commit:/d' > notes.md

      - name: Verify it is the tested candidate
        run: |
          cd dist
          actual="$(sha256sum "harmony-$VERSION.tar.gz" | awk '{print $1}')"
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::tarball sha256 $actual != tested $EXPECTED_SHA256"; exit 1; }
          python3 - <<'PY'
          import json, os
          m = json.load(open(f"harmony-{os.environ['VERSION']}.manifest.json"))
          assert m["product"] == "harmony", "not a Harmony manifest"
          assert m["version"] == os.environ["VERSION"], "manifest version mismatch"
          assert m["artifact"]["sha256"] == os.environ["EXPECTED_SHA256"], "manifest sha256 mismatch"
          assert not m["commit"].endswith("-dirty"), "built from a dirty tree"
          print("manifest OK:", m["version"], m["commit"])
          PY

      - name: Sign manifest
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          ssh-keygen -q -Y sign -f "$key" -n harmony-release "dist/harmony-$VERSION.manifest.json"
          ssh-keygen -Y verify -f allowed_signers -I harmony-release -n harmony-release \
            -s "dist/harmony-$VERSION.manifest.json.sig" < "dist/harmony-$VERSION.manifest.json"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum "harmony-$VERSION.tar.gz" "harmony-$VERSION.manifest.json" \
            "harmony-$VERSION.manifest.json.sig" > SHA256SUMS
          gh release create "v$VERSION" --title "Harmony $VERSION (candidate)" --notes-file ../notes.md --prerelease \
            "harmony-$VERSION.tar.gz" "harmony-$VERSION.manifest.json" \
            "harmony-$VERSION.manifest.json.sig" SHA256SUMS
          echo "Published candidate v$VERSION ($EXPECTED_SHA256). After testing: Actions -> Promote release." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove superseded candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One candidate waits for promotion at a time; older ones were never
          # promoted and are replaced by this one.
          for tag in $(gh release list --limit 100 --json tagName,isPrerelease,name \
              --jq '.[] | select(.isPrerelease and (.name | endswith("(candidate)"))) | .tagName'); do
            if [ "$tag" != "v$VERSION" ]; then
              gh release delete "$tag" --yes --cleanup-tag
              echo "Removed superseded candidate $tag" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
